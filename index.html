<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ea">
  <title>Frostline · Ice-sliding puzzle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="board.css">
  <script src="frost.js" defer></script>
  <script src="board.js" defer></script>
  <script src="ui.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <span class="peak" aria-hidden="true"></span>
        <h1>Frostline</h1>
      </div>
      <div class="level-tools" role="group" aria-label="Choose a level">
        <select id="difficulty" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button id="daily" type="button">Daily</button>
        <button id="new-level" type="button" aria-label="New level">New<span class="long-label"> level</span></button>
      </div>
    </header>

    <div class="play-layout">
      <section class="rink" aria-label="Playing area">
        <div class="ice-frame"><div id="board"></div></div>
        <ul class="legend" aria-label="Board symbols">
          <li><i class="key-puck" aria-hidden="true"></i>Puck</li>
          <li><i class="key-rock" aria-hidden="true"></i>Rock</li>
          <li><i class="key-snow" aria-hidden="true"></i>Snow</li>
          <li><i class="key-exit" aria-hidden="true"></i>Exit</li>
        </ul>
      </section>

      <section class="console" aria-label="Puzzle controls">
        <div class="progress">
          <dl class="score">
            <div><dt>Moves</dt><dd id="moves">0</dd></div>
            <div><dt>Par</dt><dd id="par">–</dd></div>
          </dl>
          <p id="status" role="status" aria-live="polite" aria-atomic="true">Ready to slide.</p>
        </div>
        <p class="rules">Slide the puck to the ring. Rocks and walls block it. Snow stops it. Swipe, use the arrow keys on the board, or tap an arrow. Par is the fewest slides to the exit.</p>

        <div class="controls">
          <div class="directions" role="group" aria-label="Slide the puck">
            <button type="button" data-dir="up" aria-label="Slide up">↑</button>
            <button type="button" data-dir="left" aria-label="Slide left">←</button>
            <button type="button" data-dir="down" aria-label="Slide down">↓</button>
            <button type="button" data-dir="right" aria-label="Slide right">→</button>
          </div>
          <div class="actions" role="group" aria-label="Puzzle actions">
            <button id="undo" type="button">Undo</button>
            <button id="restart" type="button">Restart</button>
            <button id="hint" type="button">Hint</button>
            <button id="playback" type="button">Show me</button>
          </div>
        </div>
        <div class="links">
          <a id="share" href="#daily">Link to this level</a>
          <button id="next-level" type="button" hidden>Next level →</button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
